<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mify Test Page</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="container">
        <h1>Mify Test Page</h1>
        <p>This is a test page to verify that CSS and images are loading correctly.</p>
        
        <div class="test-section">
            <h2>CSS Test</h2>
            <p>If you can see this styled properly, CSS is working.</p>
            <button class="btn btn-primary">Test Button</button>
        </div>
        
        <div class="test-section">
            <h2>Image Test</h2>
            <img src="assets/images/PostmanFlowMify.svg" alt="Postman Flow" style="max-width: 300px;">
            <p>If you can see the image above, images are working.</p>
        </div>
        
        <div class="test-section">
            <h2>Icons Test</h2>
            <ion-icon name="hardware-chip-outline" style="font-size: 2rem; color: #00d4ff;"></ion-icon>
            <ion-icon name="pulse-outline" style="font-size: 2rem; color: #00ff88;"></ion-icon>
            <ion-icon name="analytics-outline" style="font-size: 2rem; color: #8b5cf6;"></ion-icon>
            <p>If you can see the icons above, Ion Icons are working.</p>
        </div>
    </div>
</body>
</html>
